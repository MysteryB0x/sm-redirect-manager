name: Deploy to WordPress.org

# Runs when a GitHub Release is published (tag must match "Stable tag" in readme.txt).
# Requires repository secrets SVN_USERNAME and SVN_PASSWORD (your WordPress.org account),
# and only works after the plugin has been approved on WordPress.org.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: sm-redirect-manager
      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
