name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin (apply .distignore)
        run: |
          mkdir -p "$RUNNER_TEMP/build/sm-redirect-manager"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/build/sm-redirect-manager/"
      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/build/sm-redirect-manager
          include-experimental: true
